<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Visitor Counter</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="counter-container">
        <h1>Website Visitor Counter</h1>
        <div class="counter">
            <span class="counter-label">Total Visitors:</span>
            <span id="visitorCount" class="counter-number">0</span>
        </div>
        <p class="counter-message">Thanks for visiting our site!</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
